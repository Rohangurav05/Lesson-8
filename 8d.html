<!DOCTYPE html>
<html>

<head>
    <title> 8d problem</title>
    <style>
        .first-name-input,
        .last-name-input {
            width: 140px;
            padding: 10px 12px;
            border: 1px solid rgb(220, 216, 216);
            border-radius: 8px;
            font-size: 14px;
            margin-right: 6px;
            margin-bottom: 12px;
            outline: none;
        }

        .email-input {
            display: block;
            width: 310px;
            padding: 10px 12px;
            border: 1px solid rgb(220, 216, 216);
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 12px;
            outline: none;
        }

        .signup-button {
            display: block;
            width: 336px;
            background-color: rgb(32, 89, 224);
            color: white;
            border: none;
            padding: 12px 0;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <input type="text" placeholder="First name" class="first-name-input">
    <input type="text" placeholder="Last name" class="last-name-input">
    <input type="text" placeholder="Email" class="email-input">
    <button class="signup-button">Sign Up</button>
</body>

</html>
