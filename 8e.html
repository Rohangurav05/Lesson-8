<!DOCTYPE html>
<html>

<head>
    <title>8e problem</title>
    <style>
        .input {
            display: block;
            margin-bottom: 5px;
            background-color: rgb(231, 233, 236);
            border: none;
            margin-top: 0;
            padding-bottom: 10px;
            padding-left: 10px;
            padding-right: 80px;
            padding-top: 10px;
            font-size: 20px;
        }

        .ride {
            font-size: 30px;
            margin-top: 0;
            font-family: arial;
        }

        .request-button {
            background-color: black;
            color: white;
            border: none;

            margin-top: 20px;
            padding-left: 20px;
            padding-right: 20px;
            padding-top: 10px;
            padding-bottom: 10px;
        }
        .schedule
        {
            margin-top: 20px;
            margin-left: 10px;
            padding-left: 20px;
            padding-right: 20px;
            padding-top: 10px;
            padding-bottom: 10px;
            color: black;
            border: none;
        }
    </style>
</head>

<body>
    <p class="ride">Request a ride now</p>
    <input type="text" placeholder="Enter pickup location" class="input">
    <input type="text" placeholder="Enter destination" class="input">
    <button class="request-button">Request now</button>
    <button class="schedule">Schedule for later</button>
</body>

</html>
